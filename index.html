<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breja Family Heritage</title>
  <meta name="description" content="Browse the Breja family tree with four generations of ancestors, spouses, and descendants.">
  <meta property="og:title" content="Breja Family Heritage">
  <meta property="og:description" content="Browse the Breja family tree with four generations of ancestors, spouses, and descendants.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css?v=20260603b">
</head>
<body>

<main>
  <header>
    <h1>Breja Family Heritage</h1>
    <div class="header-line"></div>
    <p class="subtitle">Four Generations</p>
  </header>

  <div class="corner-legend" aria-label="Legend">
    <span><strong>♥</strong> spouse</span>
    <span class="legend-item legend-deceased">●</span>
    <span><strong>🕊</strong> living</span>
  </div>

  <div class="toolbar">
    <div class="search-block">
      <label for="search" class="search-label">Search family members</label>
      <input id="search" type="search" placeholder="Search by name, role, or year" aria-label="Search family members">
    </div>
    <div class="zoom-controls" aria-label="Zoom controls">
      <button id="zoom-out" type="button" class="zoom-button" aria-label="Zoom out">-</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" type="button" class="zoom-button" aria-label="Zoom in">+</button>
    </div>
    <a id="download-json" class="download-link" href="data/family.json" download="family.json">Download family data</a>
  </div>

  <div id="status" class="search-status" aria-live="polite"></div>

  <section class="info" aria-label="Family tree information">
    <p>Use the search box to highlight members in the tree. The heart icon connects spouses; faded cards mark deceased family members.</p>
  </section>

  <section id="tree-container" class="tree-container" aria-label="Family tree">
    <div id="tree" role="list">
      <p class="loading">Loading family tree…</p>
    </div>
  </section>
</main>

<noscript>
  <p class="error">JavaScript is required to render this family tree. To view the data, open <a href="data/family.json">data/family.json</a>.</p>
</noscript>

<script src="script.js?v=20260603b"></script>

</body>
</html>
